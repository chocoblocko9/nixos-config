### PROGRAMS ###
$fileManager=thunar
$menu=fuzzel
$music=lollypop
$terminal=kitty

### BINDS ###
$mod=SUPER

# Normal Binds
bind=$mod, Q, exec, runapp $terminal
bind=$mod, C, exec, bash ~/.files/modules/hjem/hyprland/scripts/minimisesteam.sh
bind=$mod, F, exec, runapp firefox
bind=$mod, M, exec, uwsm stop
bind=$mod, E, exec, runapp $fileManager
bind=$mod, V, togglefloating,
bind=$mod, D, exec, $menu
bind=$mod, P, pseudo,
bind=$mod, J, layoutmsg, togglesplit
bind=$mod, R, exec, bash ~/.files/modules/hjem/hyprland/scripts/reset.sh
bind=$mod, B, exec, bash ~/.files/modules/hjem/hyprland/scripts/minimisetospecial.sh

bind=$mod, left, movefocus, l
bind=$mod, down, movefocus, d
bind=$mod, up, movefocus, u
bind=$mod, right, movefocus, r

bind=$mod, 1, workspace, 1
bind=$mod, 2, workspace, 2
bind=$mod, 3, workspace, 3
bind=$mod, 4, workspace, 4
bind=$mod, 5, workspace, 5
bind=$mod, 6, workspace, 6
bind=$mod, 7, workspace, 7
bind=$mod, 8, workspace, 8
bind=$mod, 9, workspace, 9
bind=$mod, 0, workspace, 10

bind=$mod SHIFT, 1, movetoworkspace, 1
bind=$mod SHIFT, 2, movetoworkspace, 2
bind=$mod SHIFT, 3, movetoworkspace, 3
bind=$mod SHIFT, 4, movetoworkspace, 4
bind=$mod SHIFT, 5, movetoworkspace, 5
bind=$mod SHIFT, 6, movetoworkspace, 6
bind=$mod SHIFT, 7, movetoworkspace, 7
bind=$mod SHIFT, 8, movetoworkspace, 8
bind=$mod SHIFT, 9, movetoworkspace, 9
bind=$mod SHIFT, 0, movetoworkspace, 10

# Mouse Binds
bind=$mod, mouse_up, workspace, e-1
bind=$mod, mouse_down, workspace, e+1
bind=$mod, mouse_right, layoutmsg, cyclenext
bind=$mod, mouse_left, layoutmsg, cycleprev
bindm=$mod, mouse:272, movewindow
bindm=$mod, mouse:273, resizewindow

# Screenshot
bind=, Print, exec, grim -g "$(slurp -d)" - | wl-copy

# Music special workspace
bind=$mod, S, togglespecialworkspace, music
bind=$mod SHIFT, S, movetoworkspace, special:music

# F1-F12 binds

# hyprlang if SLIP
bindel=$mod, F2, exec, ddcutil --sleep-multiplier .1 --bus=5 setvcp 10 - 10 # brightness down
bindel=$mod, F3, exec, ddcutil --sleep-multiplier .1 --bus=5 setvcp 10 + 10 # brightness up
# hyprlang endif

# hyprlang if SLEEPLESS
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -q -n s +10%
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -q -n s 10%-
# hyprlang endif

bindel=,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+
bindel=,XF86AudioLowerVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%- 

bindl=, XF86AudioNext, exec, playerctl --player=Lollypop next
bindl=, XF86AudioPlay, exec, playerctl --player=Lollypop play-pause
bindl=, XF86AudioPrev, exec, playerctl --player=Lollypop previous
bindl=, XF86AudioStop, exec, playerctl --player=Lollypop stop
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Zoom thing
bindl=$mod, Z, exec,hyprctl keyword cursor:zoom_factor 2.5
bindrl=$mod, Z, exec,hyprctl keyword cursor:zoom_factor 1

binds {
  scroll_event_delay=50
}
