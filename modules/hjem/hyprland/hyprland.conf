### EXECUTE ON BOOT ###
exec-once=runapp soteria
exec-once=runapp kitty --class kitty-nvim nvim
exec-once=runapp quickshell

### PROGRAMS ###
$fileManager=thunar
$menu=fuzzel
$music=lollypop
$terminal=kitty

### BINDS ###
$mod=SUPER

# Normal Binds
bind=$mod, Q, exec, runapp $terminal
bind=$mod, C, exec, bash ~/.files/modules/hjem/hyprland/scripts/minimisesteam.sh
bind=$mod, F, exec, runapp firefox
bind=$mod, M, exec, uwsm stop
bind=$mod, E, exec, runapp $fileManager
bind=$mod, V, togglefloating,
bind=$mod, D, exec, $menu
bind=$mod, P, pseudo,
bind=$mod, J, togglesplit,
bind=$mod, R, exec, bash ~/.files/modules/hjem/hyprland/scripts/reset.sh
bind=$mod, B, exec, bash ~/.files/modules/hjem/hyprland/scripts/minimisetospecial.sh

bind=$mod, left, movefocus, l
bind=$mod, down, movefocus, d
bind=$mod, up, movefocus, u
bind=$mod, right, movefocus, r

bind=$mod, 1, workspace, 1
bind=$mod, 2, workspace, 2
bind=$mod, 3, workspace, 3
bind=$mod, 4, workspace, 4
bind=$mod, 5, workspace, 5
bind=$mod, 6, workspace, 6
bind=$mod, 7, workspace, 7
bind=$mod, 8, workspace, 8
bind=$mod, 9, workspace, 9
bind=$mod, 0, workspace, 10

bind=$mod SHIFT, 1, movetoworkspace, 1
bind=$mod SHIFT, 2, movetoworkspace, 2
bind=$mod SHIFT, 3, movetoworkspace, 3
bind=$mod SHIFT, 4, movetoworkspace, 4
bind=$mod SHIFT, 5, movetoworkspace, 5
bind=$mod SHIFT, 6, movetoworkspace, 6
bind=$mod SHIFT, 7, movetoworkspace, 7
bind=$mod SHIFT, 8, movetoworkspace, 8
bind=$mod SHIFT, 9, movetoworkspace, 9
bind=$mod SHIFT, 0, movetoworkspace, 10

# Mouse Binds
bind=$mod, mouse_up, workspace, e-1
bind=$mod, mouse_down, workspace, e+1
bind=$mod, mouse_right, layoutmsg, cyclenext
bind=$mod, mouse_left, layoutmsg, cycleprev
bindm=$mod, mouse:272, movewindow
bindm=$mod, mouse:273, resizewindow

# Screenshot
bind=, Print, exec, grim -g "$(slurp -d)" - | wl-copy

# Music special workspace
bind=$mod, S, togglespecialworkspace, music
bind=$mod SHIFT, S, movetoworkspace, special:music

# F1-F12 binds
bindel=$mod, F2, exec, ddcutil --sleep-multiplier .1 --bus=5 setvcp 10 - 10 # brightness down
bindel=$mod, F3, exec, ddcutil --sleep-multiplier .1 --bus=5 setvcp 10 + 10 # brightness up

bindl=, XF86AudioNext, exec, playerctl --player=Lollypop next
bindl=, XF86AudioPlay, exec, playerctl --player=Lollypop play-pause
bindl=, XF86AudioPrev, exec, playerctl --player=Lollypop previous
bindl=, XF86AudioStop, exec, playerctl --player=Lollypop stop
bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Zoom thing
bindl=$mod, Z, exec,hyprctl keyword cursor:zoom_factor 2.5
bindrl=$mod, Z, exec,hyprctl keyword cursor:zoom_factor 1

### WORKSPACE RULES ###
workspace=3, persistent:true
workspace=4, persistent:true, layout:monocle
workspace=5, persistent:true, layout:scrolling

### INPUT ###
input {
  follow_mouse=1
  kb_layout=eu
  kb_options=ctrl:swapcaps
  kb_variant=
}

### WINDOW RULES ###
windowrule=tag +defFloat, match:class org.pulseaudio.pavucontrol
windowrule=tag +defFloat, match:class nwg-look
windowrule=tag +defFloat, match:title File Operation Progress
windowrule=workspace 2 silent, match:class kitty-nvim

windowrule {
  name=opacityRules
  match:class=negative:kitty
  opacity=0.96 0.75
}
windowrule {
  name=vesktop behaviour
  float=on
  match:class=vesktop
  move=12 44
  size=1463 1023
  workspace=1
}

windowrule {
  name=Default Float Behaviour
  float=on
  match:tag=defFloat
  size=(monitor_w*0.75) (monitor_h*0.75)
}
windowrule {
  name=Lollypop float
  float=on
  match:class=lollypop
  size=(monitor_w*0.9) (monitor_h*0.9)
  workspace=special:music silent
}

### LAYER RULES ###
layerrule=match:class selector, no_anim on # fix for weird 1px black border on screenshots

### LAYOUT ###
dwindle {
  preserve_split=true
  pseudotile=true
  smart_split=true
}

### LOOK & FEEL ###
general {
  # col.active_border=rgb(072242) rgb(2A7B9B) 90deg
  # col.inactive_border=rgba(595959E6) rgba(000000E6) 30deg
  gaps_in=5
  gaps_out=5,10,10,10

  border_size=3
  resize_on_border=true
  hover_icon_on_border=true
  extend_border_grab_area=25

  layout=dwindle
  allow_tearing=false
}

decoration {
  blur {
    special=true
  }

  dim_inactive=true
  dim_strength=0.350000

  rounding=29
  rounding_power=1
}

animations {
  # Bezier curves
  bezier=linear,0,0,1,1
  bezier=easeInOutBack, 0.68, -0.6, 0.32, 1.6
  bezier=easeInOutSine, 0.37, 0, 0.63, 1
  bezier=easeInExpo, 0.7, 0, 0.84, 0
  bezier=easeOutQuart, 0.25, 1, 0.5, 1
  bezier=easeOutExpo, 0.16, 1, 0.3, 1
  bezier=easeOutExpoOvershoot, 0.16, 1, 0.3, 1.05
  bezier=easeOutCirc, 0.85, 0, 0.15, 1
  bezier=bouncyThing, 0.15, 0.60, 0.66, -0.61

  # Animations
  animation=borderangle, 1, 100, linear, loop
  animation=windowsIn, 1, 2.5, easeOutExpo, popin
  animation=windowsOut, 1, 4, easeOutExpo, popin 10%
  animation=windowsMove, 1, 0.9, easeOutExpo
  animation=workspaces, 1, 1.4, easeInOutSine, slidefade 50%
  animation=specialWorkspaceIn, 1, 2.8, easeOutExpoOvershoot, slide top
  animation=specialWorkspaceOut, 1, 5, easeInOutBack, slide bottom

  workspace_wraparound=true
}




